name: .NET

on:
  push:
    branches: [main, develop]
    paths:
      - "OpenWebUI.slnx"
      - "src/**"
      - "tests/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "OpenWebUI.slnx"
      - "src/**"
      - "tests/**"
      - ".github/workflows/dotnet.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenWebUI.slnx

      - name: Build
        run: dotnet build OpenWebUI.slnx --no-restore -c Release

      - name: Test
        run: dotnet test OpenWebUI.slnx --no-build -c Release
