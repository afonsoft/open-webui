name: .NET

on:
  push:
    branches: [main, develop]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore dotnet/OpenWebUI.slnx

      - name: Build
        run: dotnet build dotnet/OpenWebUI.slnx --no-restore -c Release

      - name: Test
        run: dotnet test dotnet/OpenWebUI.slnx --no-build -c Release
