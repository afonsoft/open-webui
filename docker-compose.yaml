# Open WebUI (.NET) — stack mínima: apenas o app.
#
#   cp .env.exemplo .env        # ajuste as variáveis (opcional)
#   docker compose up -d --build
#
# App: http://localhost:3032 (WEBUI_PORT no .env)
# Conexões com providers: .env no primeiro boot ou Configurações → Conexões (admin).
# Infra completa para testes (Ollama + Whisper): docker-compose.full.yaml

services:
  openwebui:
    build: .
    image: openwebui-dotnet
    container_name: openwebui
    ports:
      - "${WEBUI_PORT:-3032}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - openwebui:/app/data
    deploy:
      resources:
        limits:
          memory: ${WEBUI_MEM_LIMIT:-4g}
    restart: unless-stopped

volumes:
  openwebui:
