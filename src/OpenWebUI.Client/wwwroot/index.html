<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#171717" />
		<title>Open WebUI</title>
		<base href="/" />
		<link rel="icon" type="image/png" href="favicon.png" />
		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
		<link rel="stylesheet" href="css/tailwind.css" />
		<link href="OpenWebUI.Client.styles.css" rel="stylesheet" />
		<script>
			// Aplica o tema antes do primeiro paint, como no upstream.
			const theme = localStorage.getItem('webui.theme') || 'dark';
			const isDark =
				theme === 'dark' ||
				(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
			document.documentElement.classList.toggle('dark', isDark);
			document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
		</script>
		<script src="js/app.js"></script>
		<script src="js/codeexec.js"></script>
	</head>

	<body>
		<div id="app">
			<div class="boot-splash">
				<img src="assets/splash-dark.png" alt="Open WebUI" />
				<span>Open WebUI</span>
			</div>
		</div>

		<div id="blazor-error-ui">
			An unhandled error has occurred.
			<a href="." class="reload">Reload</a>
			<span class="dismiss">🗙</span>
		</div>
		<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
	</body>
</html>
